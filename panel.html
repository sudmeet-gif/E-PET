<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="theme.css"><title>小猫的小窝</title></head><body>
<main>
  <header><div><div class="eyebrow">一只猫的慢生活</div><h1><span id="pet-name">奶糖</span>的小窝<span class="dot"></span></h1><p id="status">正在安静陪着你</p></div><img id="portrait" src="assets/frames/none/0.png" alt="可爱的白猫"></header>
  <section><div class="section-title"><h2>陪它一会儿</h2><span id="next">30 秒后小动作</span></div><div class="actions">
    <button data-action="idle"><span>☀</span>待机</button><button data-action="play"><span>♧</span>逗猫</button><button data-action="feed"><span>♡</span>喂食</button><button data-action="fish"><span>♒</span>抓鱼</button><button data-action="rest"><span>☁</span>休息</button><button data-action="sleep"><span>☾</span>睡觉</button>
  </div><p class="hint" id="hint">双击小猫可以摸摸它，按住小猫可以拖动。</p></section>
  <section><div class="section-title"><h2>今天穿什么</h2><span>换装会自动记住</span></div><div class="outfits">
    <button data-outfit="none"><i class="swatch none"></i>无</button><button data-outfit="rose"><i class="swatch rose"></i>莓粉针织</button><button data-outfit="sailor"><i class="swatch sailor"></i>晴蓝水手</button><button data-outfit="honey"><i class="swatch honey"></i>暖黄毛衣</button>
  </div></section>
  <section class="settings"><div class="appearance"><span>小窝外观</span><div><button data-theme="day">☀ 日间</button><button data-theme="night">☾ 夜间</button></div></div><div class="rename"><label for="name">小猫名字</label><input id="name" maxlength="24" placeholder="取一个喜欢的名字" aria-label="小猫名字"><button id="rename">保存</button></div><div class="sound"><button id="mute" aria-label="音效开关">音效开</button><input id="volume" type="range" min="0" max="100" value="32" aria-label="音量"><span id="volume-value">32%</span></div><div class="options"><label for="size">大小 <select id="size"><option value="0.8">小</option><option value="1">标准</option><option value="1.25">大</option><option value="1.5">更大</option></select></label><label><input id="topmost" type="checkbox" checked> 始终置顶</label><button id="pause">暂停活动</button></div><label class="startup"><span>开机自启动<small>登录 Windows 后，让小猫自动来陪你</small></span><input id="autostart" type="checkbox" role="switch" aria-label="开机自启动"></label></section>
  <footer><span id="fish-count">已抓到 0 条鱼</span><div><button id="hide">隐藏小猫</button><button id="quit">退出</button></div></footer><p class="footnote">隐藏后可从任务栏右侧的小猫图标找回。</p><div id="toast" role="status"></div>
</main><script src="panel.js"></script></body></html>
